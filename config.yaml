# config.yaml
# Central Configuration for DeepTriage-CN

# --- Random State for Reproducibility ---
random_state: 42

# --- Data ---
data:
  # Path to the full synthetic dataset (generated by data/generate_synthetic_data.py)
  raw_data_path: "data/sample_data.csv"
  # Temporal split point (YYYY-MM-DD), mimicking the paper's "1 Jan 2023 - 31 Mar 2024" split
  training_cutoff_date: "2024-01-01"  # Data before this is for training
  validation_start_date: "2024-01-01" # Data from this point onwards is for validation
  # Proportion for train/val split if processing a single static file
  # validation_size: 0.2

# --- Text Preprocessing ---
text_processing:
  model_name: "bert-base-chinese"
  max_length: 64
  # Special token for missing chief complaints
  missing_token: "[MISSING]"

# --- TabNet Model Hyperparameters (from paper) ---
tabnet:
  # Optimized via grid search, as described in Section 3.6
  n_d: 32   # Width of the decision prediction layer
  n_a: 32   # Width of the attention embedding for each mask
  n_steps: 5 # Number of steps in the architecture
  gamma: 1.5  # Relaxation parameter
  lambda_sparse: 0.0001 # Sparsity regularization strength
  optimizer: "AdamW"
  batch_size: 256
  virtual_batch_size: 128
  # Cosine annealing learning rate schedule is implemented in the training script
  max_epochs: 100 # With early stopping

# --- XGBoost Model Hyperparameters (from paper) ---
xgboost:
  # Primary hyperparameters for both vitals-only and late-fusion classifiers
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  # scale_pos_weight is adjusted dynamically in code based on training set class imbalance
  early_stopping_rounds: 3

# --- Robustness Simulation (from paper Section 3.7) ---
robustness:
  # Proportions of values to remove under MNAR mechanism
  missing_proportions: [0.1, 0.2, 0.3]
  # Standard deviation multiplier for Gaussian noise injection
  noise_sigma_multiplier: 0.5

# --- Evaluation & Prediction Threshold ---
evaluation:
  # Youden-optimal threshold determined on the training set
  optimal_threshold: 0.28
  # Number of iterations for bootstrap confidence intervals
  n_bootstrap: 1000

# --- Paths for Outputs ---
output_paths:
  models_dir: "outputs/models/"
  results_dir: "outputs/results/"
  figures_dir: "outputs/figures/"
  logs_dir: "outputs/logs/"