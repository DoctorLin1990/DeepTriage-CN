name: deeptriage-cn
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - numpy=1.24.4
  - pandas=2.0.3
  - scipy=1.10.1
  - scikit-learn=1.3.2
  - matplotlib=3.7.5
  - seaborn=0.13.0
  - jupyter=1.0.0
  - pyyaml=6.0.1
  - tqdm=4.66.1
  - joblib=1.3.2
  - pytorch=2.0.1
  - torchvision=0.15.2 # Often a dependency, but not strictly required
  - torchaudio=2.0.2 # Same as above
  - pip
  - pip:
    - transformers==4.35.2
    - xgboost==2.0.3
    - pytorch-tabnet==4.1.0
    - shap==0.44.0