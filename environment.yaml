name: deeptriage
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pytorch>=2.1.0
  - pytorch-cuda=11.8     # remove this line for CPU-only installation
  - pip:
    - transformers>=4.38.0
    - xgboost>=2.0.0
    - pytorch-tabnet>=4.1.0
    - scikit-learn>=1.4.0
    - shap>=0.44.0
    - pandas>=2.1.0
    - numpy>=1.26.0
    - scipy>=1.12.0
    - matplotlib>=3.8.0
    - PyYAML>=6.0.1
    - joblib>=1.3.0
    - pytest>=8.0.0
    - pytest-cov>=5.0.0
